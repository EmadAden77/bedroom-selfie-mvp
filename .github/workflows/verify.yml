name: Verify application
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Real TypeScript check
        run: npm run typecheck
      - name: Serverless TypeScript native ESM import smoke test
        run: node --experimental-strip-types --input-type=module -e "const route = await import('./api/generate-main-prompt.ts'); if (typeof route.default?.fetch !== 'function') process.exit(1)"
      - name: Unit tests
        run: npm test
      - name: Production Vite build
        run: npm run build
