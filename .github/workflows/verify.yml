name: Verify application
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          echo __PRE_V2_LOCK_BEGIN__
          cat package-lock.json
          echo __PRE_V2_LOCK_END__
      - name: Real TypeScript check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production Vite build
        run: npm run build
